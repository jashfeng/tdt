<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天地图 + MapLibre GL JS 全量测试台</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; }
  #map { position: absolute; top: 0; left: 0; right: 340px; height: 100vh; }
  .side {
    position: absolute; top: 0; right: 0; width: 340px; height: 100vh;
    background: #f7f7f7; border-left: 1px solid #ddd; overflow-y: auto; z-index: 20;
    display: flex; flex-direction: column;
  }
  .side .head { padding: 8px; background: #fff; border-bottom: 1px solid #ddd; }
  .side input { width: 100%; padding: 5px 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; margin-bottom: 4px; }
  .side button {
    padding: 5px 9px; border: none; border-radius: 4px; margin: 2px;
    background: #4A90D9; color: #fff; font-size: 11px; cursor: pointer;
  }
  .side button.main { background: #E67E22; font-weight: bold; }
  .side button.danger { background: #E74C3C; }
  .side .grp { padding: 6px 8px; border-bottom: 1px solid #eee; background: #fff; }
  .side .grp h4 { font-size: 12px; color: #333; margin-bottom: 3px; }
  #log {
    flex: 1; padding: 8px; font-size: 11px; line-height: 1.5;
    font-family: Consolas, monospace; overflow-y: auto; background: #1e1e1e; color: #d4d4d4;
  }
  #log .pass { color: #4ec9b0; }
  #log .fail { color: #f48771; font-weight: bold; }
  #log .info { color: #9cdcfe; }
  #log .warn { color: #dcdcaa; }
</style>
</head>
<body>

<div id="map"></div>
<div class="side">
  <div class="head">
    <input id="keyInput" type="text" placeholder="天地图 Key（服务器端类型，apiKey）" />
    <input id="webKeyInput" type="text" placeholder="天地图 Key（浏览器端类型，webApiKey）" />
    <button class="main" onclick="runAllTests()">▶ 全量自动测试</button>
    <button onclick="initMap()">加载地图</button>
    <button class="danger" onclick="destroyTest()">销毁地图</button>
  </div>
  <div class="grp"><h4>图层</h4>
    <button onclick="switchLayer('vec')">矢量</button>
    <button onclick="switchLayer('img')">影像</button>
    <button onclick="switchLayer('ter')">地形</button>
  </div>
  <div class="grp"><h4>视野/手势</h4>
    <button onclick="testViewport()">视野函数</button>
    <button onclick="testGestures()">手势开关</button>
    <button onclick="testRotate()">旋转倾斜</button>
  </div>
  <div class="grp"><h4>覆盖物</h4>
    <button onclick="testOverlays()">全部覆盖物</button>
    <button onclick="testOverlayMgmt()">显隐/移除</button>
    <button onclick="testMarkerClick()">标记点击回调</button>
    <button onclick="testInfoWindow()">信息窗口</button>
  </div>
  <div class="grp"><h4>工具/信息</h4>
    <button onclick="testTools()">工具函数</button>
    <button onclick="testSnapshot()">截图</button>
    <button onclick="testCustomTile()">自定义瓦片</button>
    <button onclick="testUserLoc()">定位</button>
  </div>
  <div class="grp"><h4>v1.7.0 可视化</h4>
    <button onclick="testCluster()">聚合 300 点</button>
    <button onclick="testClusterClick()">聚合点击展开</button>
    <button onclick="testHeatmap()">热力 500 点</button>
    <button onclick="clearVis()">清除可视化</button>
  </div>
  <div class="grp"><h4>v1.8.0 图层增强</h4>
    <button onclick="testV180Wms()">1.WMS 叠加</button>
    <button onclick="testV180SetStyle()">2.setStyle</button>
    <button onclick="testV180RemoveStyle()">3.removeStyle</button>
    <button onclick="testV180Misc()">4.边界/canvas</button>
  </div>
  <div class="grp"><h4>天地图 Web API（重点）</h4>
    <button onclick="testGeocoderFormats()">geocoder 格式对比</button>
    <button onclick="testSearchQueryTypes()">v2/search 各 queryType</button>
    <button onclick="testSearchImpl()">插件当前实现复刻</button>
  </div>
  <div id="log"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 测试台基础设施：日志 + 结果收集（window.__tdtResults 供外部读取）
// ═══════════════════════════════════════════════════════════
window.__tdtResults = [];
const LOG_MAX = 400;

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg);
  el.appendChild(line);
  while (el.children.length > LOG_MAX) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function record(name, pass, detail) {
  const r = { name: name, pass: !!pass, detail: detail || '' };
  window.__tdtResults.push(r);
  log((pass ? '[PASS] ' : '[FAIL] ') + name + (detail ? ' — ' + detail : ''), pass ? 'pass' : 'fail');
}

function getKeys() {
  const params = new URLSearchParams(location.search);
  const k1 = document.getElementById('keyInput').value.trim() || params.get('apiKey') || '';
  const k2 = document.getElementById('webKeyInput').value.trim() || params.get('webApiKey') || '';
  if (k1) document.getElementById('keyInput').value = k1;
  if (k2) document.getElementById('webKeyInput').value = k2;
  return { apiKey: k1, webApiKey: k2 || k1 };
}

// ═══════════════════════════════════════════════════════════
// 与 web/index.uts 同构复刻的地图逻辑
// ═══════════════════════════════════════════════════════════
let map = null;
let currentType = 'vec';
const markerMap = new Map();      // id → Marker
const overlayMap = new Map();     // id → {type, sourceId?, layerId?, visible}
const markerInfoMap = new Map();  // id → {title, snippet}
let nextOverlayId = 0;
let polygonList = [], polylineList = [], circleList = [], rectangleList = [], labelList = [];
const customTileLayers = new Map();
let markerClickCallback = null;

const LAYERS = {
  vec:  { map: 'vec_w', anno: 'cva_w' },
  img:  { map: 'img_w', anno: 'cia_w' },
  ter:  { map: 'ter_w', anno: 'cta_w' }
};
const SUBDOMAINS = ['0','1','2','3','4','5','6','7'];
const TDT_API_BASE = 'https://api.tianditu.gov.cn';
// URL 参数 proxy=1 时启用本地代理模式：瓦片经 localhost:8123/tdt-proxy 转发，
// 由 Node 服务端用服务器端 apiKey 请求（绕过浏览器端 Key 的域名白名单限制）
const isProxy = new URLSearchParams(window.location.search).get('proxy') === '1';
// 代理模式下 tk 强制使用 URL 参数的 apiKey（服务器端），不读输入框——
// 避免用户按输入框误填浏览器端 Key 导致代理 403
const PROXY_API_KEY = new URLSearchParams(window.location.search).get('apiKey') || '';

function tileUrl(t, key) {
  const s = SUBDOMAINS[Math.floor(Math.random() * 8)];
  if (isProxy) {
    return `/tdt-proxy?t=${t}&s=${s}&x={x}&y={y}&z={z}&tk=${PROXY_API_KEY}`;
  }
  return `https://t${s}.tianditu.gov.cn/DataServer?T=${t}&x={x}&y={y}&l={z}&tk=${key}`;
}
function genOverlayId() { nextOverlayId++; return nextOverlayId; }

function initMap() {
  const { apiKey } = getKeys();
  if (!apiKey) { log('请先输入天地图 Key', 'fail'); return; }
  if (map) { map.remove(); map = null; }
  markerMap.clear(); overlayMap.clear(); markerInfoMap.clear();
  polygonList = []; polylineList = []; circleList = []; rectangleList = []; labelList = [];
  customTileLayers.clear(); nextOverlayId = 0;

  map = new maplibregl.Map({
    container: 'map',
    style: { version: 8, glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf', sources: {}, layers: [] },
    center: [116.4075, 39.9042],
    zoom: 12,
    maxZoom: 18,
    minZoom: 1,
    attributionControl: false
  });

  if (document.getElementById('tdt-hide-logo-style') == null) {
    const s = document.createElement('style');
    s.id = 'tdt-hide-logo-style';
    s.textContent = '.maplibregl-ctrl-logo { display: none !important; }';
    document.head.appendChild(s);
  }
  const navControl = new maplibregl.NavigationControl({ showCompass: false });
  map.addControl(navControl, 'bottom-right');
  const scaleControl = new maplibregl.ScaleControl({ maxWidth: 100 });
  map.addControl(scaleControl, 'bottom-right');

  map.on('load', () => {
    map.addSource('tdt-base', { type: 'raster', tiles: [tileUrl(LAYERS[currentType].map, apiKey)], tileSize: 256, maxzoom: 18, minzoom: 1 });
    map.addLayer({ id: 'tdt-base-layer', type: 'raster', source: 'tdt-base' });
    map.addSource('tdt-anno', { type: 'raster', tiles: [tileUrl(LAYERS[currentType].anno, apiKey)], tileSize: 256, maxzoom: 18, minzoom: 1 });
    map.addLayer({ id: 'tdt-anno-layer', type: 'raster', source: 'tdt-anno' });
    log('地图加载成功（load 事件）', 'pass');
  });

  map.on('click', (e) => {
    // 聚合图层不存在时 queryRenderedFeatures 会抛错（MapLibre 行为），先判空
    if (map.getLayer('tdt-cluster-layer') == null) {
      log('地图点击: ' + e.lngLat.lat.toFixed(5) + ', ' + e.lngLat.lng.toFixed(5), 'info');
      return;
    }
    const clusterHits = map.queryRenderedFeatures(e.point, { layers: ['tdt-cluster-layer'] });
    if (clusterHits != null && clusterHits.length > 0) return;
    log('地图点击: ' + e.lngLat.lat.toFixed(5) + ', ' + e.lngLat.lng.toFixed(5), 'info');
  });
  map.on('moveend', () => { /* cameraChange 复刻 */ });
  map.on('error', (e) => {
    console.error('MapLibre 错误:', e);
    log('❌ 地图错误事件: ' + (e && e.error ? e.error.message : JSON.stringify(e).slice(0, 120)), 'fail');
  });
}

function destroyTest() {
  if (map) { try { map.remove(); } catch (e) {} map = null; }
  log('地图已销毁');
}

function switchLayer(type) {
  // 用 getSource 判空替代 loaded()：loaded() 在 style 有 pending 变更时长期为 false，
  // 而 source 是 load 回调里创建的，存在即说明样式已就绪（官方文档 loaded() 语义）
  if (!map || map.getSource('tdt-base') == null) { log('地图尚未加载', 'warn'); return; }
  currentType = type;
  const { apiKey } = getKeys();
  map.getSource('tdt-base').setTiles([tileUrl(LAYERS[type].map, apiKey)]);
  map.getSource('tdt-anno').setTiles([tileUrl(LAYERS[type].anno, apiKey)]);
  log('已切换到: ' + type, 'info');
}

// ── 同构复刻：覆盖物 ──
function addGeoJSONOverlay(type, geojson, layerPaint, layerLayout) {
  if (!map) return 0;
  const id = genOverlayId();
  const sourceId = 'overlay-src-' + id;
  const layerId = 'overlay-layer-' + id;
  try {
    map.addSource(sourceId, { type: 'geojson', data: geojson });
    const layerDef = { id: layerId, type: type, source: sourceId, paint: layerPaint };
    if (layerLayout != null) layerDef.layout = layerLayout;
    map.addLayer(layerDef);
    overlayMap.set(id, { type: type, sourceId: sourceId, layerId: layerId, visible: true });
  } catch (e) { console.error('addGeoJSONOverlay 失败', e); return 0; }
  return id;
}

function addMarkerPoc(lat, lng, title, snippet) {
  if (!map) return 0;
  const id = genOverlayId();
  try {
    const popup = new maplibregl.Popup({ offset: 25 })
      .setHTML('<b>' + title + '</b>' + (snippet && snippet.length > 0 ? '<br/>' + snippet : ''));
    const marker = new maplibregl.Marker({ color: '#FF4444' })
      .setLngLat([lng, lat]).setPopup(popup).addTo(map);
    markerMap.set(id, marker);
    overlayMap.set(id, { type: 'marker', visible: true });
    if (snippet != null && snippet.length > 0) markerInfoMap.set(id, { title: title, snippet: snippet });
    // v1.7.1 复刻修复后 web/index.uts：marker 为独立 DOM，click 不冒泡到 canvas；
    // 闭包读模块级回调，任意时机 setMarkerClickCallback 均对全部 marker 生效
    marker.getElement().addEventListener('click', () => {
      if (markerClickCallback != null) {
        const ll = marker.getLngLat();
        markerClickCallback({ lat: ll.lat, lng: ll.lng });
      }
    });
  } catch (e) { console.error('addMarker 失败', e); return 0; }
  return id;
}

function addPolylinePoc(points, color, width) {
  const coords = points.map(p => [p.lng, p.lat]);
  const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
  const id = addGeoJSONOverlay('line', geojson, { 'line-color': color, 'line-width': width, 'line-opacity': 0.8 });
  if (id > 0) polylineList.push(id);
  return id;
}
function addCirclePoc(lat, lng, radius, color, fillColor) {
  const coords = [];
  const segments = 64;
  const radiusDeg = radius / 111320.0;
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * 2.0 * Math.PI;
    coords.push([lng + radiusDeg * Math.cos(angle), lat + radiusDeg * Math.sin(angle)]);
  }
  const geojson = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } };
  const id = addGeoJSONOverlay('fill', geojson, { 'fill-color': fillColor, 'fill-outline-color': color, 'fill-opacity': 0.5 });
  if (id > 0) circleList.push(id);
  return id;
}
function addRectanglePoc(minLat, minLng, maxLat, maxLng, color, fillColor) {
  const coords = [[minLng, minLat], [maxLng, minLat], [maxLng, maxLat], [minLng, maxLat], [minLng, minLat]];
  const geojson = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } };
  const id = addGeoJSONOverlay('fill', geojson, { 'fill-color': fillColor, 'fill-outline-color': color, 'fill-opacity': 0.5 });
  if (id > 0) rectangleList.push(id);
  return id;
}
function addPolygonPoc(points, color, fillColor) {
  const coords = points.map(p => [p.lng, p.lat]);
  if (coords.length > 0) {
    const first = coords[0], last = coords[coords.length - 1];
    if (first[0] !== last[0] || first[1] !== last[1]) coords.push([first[0], first[1]]);
  }
  const geojson = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } };
  const id = addGeoJSONOverlay('fill', geojson, { 'fill-color': fillColor, 'fill-outline-color': color, 'fill-opacity': 0.5 });
  if (id > 0) polygonList.push(id);
  return id;
}
function addLabelPoc(lat, lng, text) {
  if (!map) return 0;
  const id = genOverlayId();
  try {
    const marker = new maplibregl.Marker({ color: '#3366FF' })
      .setLngLat([lng, lat])
      .setPopup(new maplibregl.Popup().setText(text))
      .addTo(map);
    // v1.7.1 复刻修复后 web/index.uts：立即打开 popup 显示文字——
    // popup 默认关闭时文字不可见，与 Android/iOS 语义不一致
    marker.togglePopup();
    markerMap.set(id, marker);
    overlayMap.set(id, { type: 'label', visible: true });
  } catch (e) { console.error('addLabel 失败', e); return 0; }
  labelList.push(id);
  return id;
}
function removeOverlayInternal(id) {
  const entry = overlayMap.get(id);
  if (entry == null) return;
  if (entry.type === 'marker' || entry.type === 'label') {
    const marker = markerMap.get(id);
    if (marker != null) { try { marker.remove(); } catch (e) {} markerMap.delete(id); }
    markerInfoMap.delete(id);
  } else {
    if (entry.layerId != null && map != null) { try { if (map.getLayer(entry.layerId) != null) map.removeLayer(entry.layerId); } catch (e) {} }
    if (entry.sourceId != null && map != null) { try { if (map.getSource(entry.sourceId) != null) map.removeSource(entry.sourceId); } catch (e) {} }
  }
  overlayMap.delete(id);
}
function removeOverlayPoc(id) {
  removeOverlayInternal(id);
  polygonList = polygonList.filter(x => x !== id);
  polylineList = polylineList.filter(x => x !== id);
  circleList = circleList.filter(x => x !== id);
  rectangleList = rectangleList.filter(x => x !== id);
  labelList = labelList.filter(x => x !== id);
}
function hideOverlayPoc(id) {
  const entry = overlayMap.get(id);
  if (entry == null || map == null) return;
  if (entry.type === 'marker' || entry.type === 'label') {
    const marker = markerMap.get(id);
    if (marker != null) { try { marker.remove(); } catch (e) {} }
  } else if (entry.layerId != null) {
    try { map.setLayoutProperty(entry.layerId, 'visibility', 'none'); } catch (e) {}
  }
  entry.visible = false;
}
function showOverlayPoc(id) {
  const entry = overlayMap.get(id);
  if (entry == null || map == null) return;
  if (entry.type === 'marker' || entry.type === 'label') {
    const marker = markerMap.get(id);
    if (marker != null) marker.addTo(map);
  } else if (entry.layerId != null) {
    try { map.setLayoutProperty(entry.layerId, 'visibility', 'visible'); } catch (e) {}
  }
  entry.visible = true;
}
function clearMarkersPoc() {
  if (map == null) return;
  markerMap.forEach((marker, id) => {
    try { marker.remove(); } catch (e) {}
    overlayMap.delete(id);
    markerInfoMap.delete(id);
  });
  markerMap.clear();
  // 复刻 web/index.uts clearMarkers 的最后一行（疑似死代码）
  polygonList = polygonList.filter(id => overlayMap.get(id)?.type !== 'marker');
}

// ── 同构复刻：天地图 HTTP 请求（插件当前实现） ──
function buildTdtApiUrl(endpoint, params, key) {
  let url = TDT_API_BASE + endpoint + '?';
  params.set('tk', key);
  let first = true;
  params.forEach((value, k) => {
    if (!first) url += '&';
    url += encodeURIComponent(k) + '=' + encodeURIComponent(value);
    first = false;
  });
  return url;
}
function fetchJson(url) {
  if (isProxy) {
    // 代理模式：API 请求走本地 /tdt-api 转发（Node 服务端 UA，无浏览器 UA/Referer），
    // 且 tk 强制换成服务器端 apiKey——绕过 301007 域名白名单与 301013 权限类型拦截
    const u = new URL(url, 'http://localhost');
    if (PROXY_API_KEY.length > 0) u.searchParams.set('tk', PROXY_API_KEY);
    return fetch('/tdt-api?u=' + encodeURIComponent(u.toString()))
      .then(r => r.json()).then(j => ({ status: 'ok', json: j }))
      .catch(e => ({ status: 'err', json: { error: String(e) } }));
  }
  return fetch(url).then(r => r.json()).then(j => ({ status: 'ok', json: j }))
    .catch(e => ({ status: 'err', json: { error: String(e) } }));
}
function summarize(json) {
  try {
    if (json == null) return 'null';
    const s = JSON.stringify(json);
    if (s.length <= 160) return s;
    return s.slice(0, 160) + '…';
  } catch (e) { return String(json); }
}

// ═══════════════════════════════════════════════════════════
// 分组测试函数
// ═══════════════════════════════════════════════════════════

async function ensureMapLoaded() {
  if (map == null) initMap();
  if (!map.loaded()) {
    await new Promise((resolve) => {
      const t = setTimeout(resolve, 15000);
      map.once('load', () => { clearTimeout(t); resolve(); });
    });
  }
  // 防御：官方文档说明 source/style 有未完成变更时 loaded() 仍返回 false，load 事件只 fire 一次，
  // 改用轮询等待真正 loaded（3s 超时兜底，不中断测试）
  const t1 = Date.now();
  while (!map.loaded() && Date.now() - t1 < 3000) {
    await new Promise(r => setTimeout(r, 100));
  }
}

async function runAllTests() {
  if (window.__tdtRunning === true) { log('测试已在运行中，忽略重复触发', 'warn'); return; }
  window.__tdtRunning = true;
  try { await runAllTestsInner(); } finally { window.__tdtRunning = false; }
}

async function runAllTestsInner() {
  window.__tdtResults = [];
  log('═══ 开始全量自动测试 ═══', 'info');
  const { apiKey } = getKeys();
  if (!apiKey) { log('缺少天地图 Key，中止', 'fail'); return; }
  try {
    await ensureMapLoaded();
    record('地图加载', true);
    await testSwitchLayers();
    await testViewport();
    testGestures();
    testRotate();
    testOverlays();
    testOverlayMgmt();
    testMarkerClick();
    testInfoWindow();
    testTools();
    testSnapshot();
    await testCustomTile();
    testUserLoc();
    await testCluster();
    await testClusterClick();
    await testHeatmap();
    await testGeocoderFormats();
    await testSearchQueryTypes();
    await testSearchImpl();
  } catch (e) {
    record('全量测试异常中断', false, String(e));
  }
  const fails = window.__tdtResults.filter(r => !r.pass).length;
  log('═══ 测试完成：' + (window.__tdtResults.length - fails) + ' 通过 / ' + fails + ' 失败 ═══', fails > 0 ? 'fail' : 'pass');
}

async function testSwitchLayers() {
  // 轮询等 loaded（3s 兜底），避免 load 已 fire 而 loaded() 仍 false 时 once('load') 死等
  const t0 = Date.now();
  while (!map.loaded() && Date.now() - t0 < 3000) {
    await new Promise(r => setTimeout(r, 100));
  }
  for (const t of ['img', 'ter', 'vec']) {
    try {
      switchLayer(t);
      await new Promise(r => setTimeout(r, 2500));
      const src = map.getSource('tdt-base');
      // MapLibre source 对象不暴露 tiles 属性，用 serialize() 读取（官方 API：RasterSourceSpecification.tiles）
      const ser = src != null ? src.serialize() : null;
      const tiles = (ser != null && ser.tiles != null) ? ser.tiles : [];
      // serialize().tiles 的 URL 参数：直连为大写 T=，代理为小写 t=，断言大小写不敏感
      const u0 = String(tiles[0] || '').toLowerCase();
      const ok = tiles.length > 0 && u0.includes('t=' + LAYERS[t].map);
      record('切换图层 ' + t, ok, ok ? tiles[0].split('?')[1].split('&')[0] : 'tiles 为空');
    } catch (e) { record('切换图层 ' + t, false, String(e)); }
  }
}

// ── v1.7.0 聚合/热力（同构复刻） ──
function generatePoints(count, withWeight, span) {
  const half = (span != null ? span : 0.5) / 2;
  const pts = [];
  for (let i = 0; i < count; i++) {
    const p = { lat: 31.2304 + (Math.random() - 0.5) * half * 2, lng: 121.4737 + (Math.random() - 0.5) * half * 2 };
    if (withWeight) p.weight = Math.floor(Math.random() * 10) + 1;
    pts.push(p);
  }
  return pts;
}

function addMarkerClusterPoc(points, options) {
  if (!map) return;
  removeMarkerClusterPoc();
  if (!points || points.length === 0) return;
  const radius = (options && options.clusterRadius) || 50;
  const maxZoom = (options && options.clusterMaxZoom) || 14;
  const features = points.map(p => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.lng, p.lat] }, properties: {} }));
  map.addSource('tdt-cluster-source', { type: 'geojson', data: { type: 'FeatureCollection', features: features }, cluster: true, clusterRadius: radius, clusterMaxZoom: maxZoom });
  map.addLayer({ id: 'tdt-cluster-layer', type: 'circle', source: 'tdt-cluster-source', filter: ['has', 'point_count'],
    paint: { 'circle-color': ['step', ['get', 'point_count'], '#51BBD6', 100, '#F1F075', 750, '#F28CB1'], 'circle-radius': ['step', ['get', 'point_count'], 20, 100, 30, 750, 40], 'circle-stroke-width': 1, 'circle-stroke-color': '#FFFFFF' } });
  map.addLayer({ id: 'tdt-cluster-count', type: 'symbol', source: 'tdt-cluster-source', filter: ['has', 'point_count'],
    layout: { 'text-field': '{point_count_abbreviated}', 'text-font': ['Open Sans Semibold'], 'text-size': 12 } });
  map.addLayer({ id: 'tdt-cluster-unclustered', type: 'circle', source: 'tdt-cluster-source', filter: ['!', ['has', 'point_count']],
    paint: { 'circle-color': '#11B4DA', 'circle-radius': 5, 'circle-stroke-width': 1, 'circle-stroke-color': '#FFFFFF' } });
  map.on('click', 'tdt-cluster-layer', onClusterClickPoc);
}
function onClusterClickPoc(e) {
  const features = map.queryRenderedFeatures(e.point, { layers: ['tdt-cluster-layer'] });
  if (features == null || features.length === 0) return;
  const clusterId = features[0].properties.cluster_id;
  if (clusterId == null) return;
  map.getSource('tdt-cluster-source').getClusterExpansionZoom(clusterId).then((zoom) => {
    map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
  });
}
function removeMarkerClusterPoc() {
  if (!map) return;
  // MapLibre removeLayer 对不存在图层会 fire error 事件（吞不掉），先判空避免污染日志
  if (map.getLayer('tdt-cluster-layer') != null) map.removeLayer('tdt-cluster-layer');
  if (map.getLayer('tdt-cluster-count') != null) map.removeLayer('tdt-cluster-count');
  if (map.getLayer('tdt-cluster-unclustered') != null) map.removeLayer('tdt-cluster-unclustered');
  if (map.getSource('tdt-cluster-source') != null) map.removeSource('tdt-cluster-source');
}

function addHeatmapPoc(points, options) {
  if (!map) return;
  removeHeatmapPoc();
  if (!points || points.length === 0) return;
  const features = points.map(p => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.lng, p.lat] }, properties: { weight: p.weight || 1 } }));
  map.addSource('tdt-heatmap-source', { type: 'geojson', data: { type: 'FeatureCollection', features: features } });
  map.addLayer({ id: 'tdt-heatmap-layer', type: 'heatmap', source: 'tdt-heatmap-source',
    paint: { 'heatmap-weight': ['get', 'weight'], 'heatmap-radius': (options && options.radius) || 30, 'heatmap-opacity': (options && options.opacity) || 0.6,
      'heatmap-color': ['interpolate', ['linear'], ['heatmap-density'], 0, 'rgba(0, 0, 255, 0)', 0.2, 'rgb(0, 0, 255)', 0.4, 'rgb(0, 255, 0)', 0.6, 'rgb(255, 255, 0)', 0.8, 'rgb(255, 165, 0)', 1, 'rgb(255, 0, 0)'] } });
}
function removeHeatmapPoc() {
  if (!map) return;
  if (map.getLayer('tdt-heatmap-layer') != null) map.removeLayer('tdt-heatmap-layer');
  if (map.getSource('tdt-heatmap-source') != null) map.removeSource('tdt-heatmap-source');
}

// ═══════════════════════════════════════════════════════════
// 工具函数复刻（getDistance/getViewport/gcj02ToWgs84）
// ═══════════════════════════════════════════════════════════
const PI = 3.141592653589793, A = 6378245.0, EE = 0.006693421622965943;
function isOutOfChina(lat, lng) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function transformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320.0 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function gcj02ToWgs84Poc(lat, lng) {
  if (isOutOfChina(lat, lng)) return { lat: lat, lng: lng };
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return { lat: lat - dLat, lng: lng - dLng };
}
function getDistancePoc(start, end) {
  const R = 6371000.0;
  const dLat = (end.lat - start.lat) * PI / 180.0;
  const dLng = (end.lng - start.lng) * PI / 180.0;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(start.lat * PI / 180.0) * Math.cos(end.lat * PI / 180.0) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function getViewportPoc(points) {
  if (points.length === 0) return { center: { lat: 0, lng: 0 }, zoom: 0 };
  if (points.length === 1) return { center: points[0], zoom: 15 };
  let minLat = points[0].lat, maxLat = points[0].lat, minLng = points[0].lng, maxLng = points[0].lng;
  for (let i = 1; i < points.length; i++) {
    if (points[i].lat < minLat) minLat = points[i].lat;
    if (points[i].lat > maxLat) maxLat = points[i].lat;
    if (points[i].lng < minLng) minLng = points[i].lng;
    if (points[i].lng > maxLng) maxLng = points[i].lng;
  }
  const centerLat = (minLat + maxLat) / 2.0, centerLng = (minLng + maxLng) / 2.0;
  const maxSpan = Math.max(Math.abs(maxLat - minLat), Math.abs(maxLng - minLng));
  let zoom = 15;
  if (maxSpan > 0.0001) zoom = Math.floor(Math.log2(360.0 / maxSpan)) + 1;
  if (zoom > 18) zoom = 18;
  if (zoom < 3) zoom = 3;
  return { center: { lat: centerLat, lng: centerLng }, zoom: zoom };
}

// ═══════════════════════════════════════════════════════════
// v1.8.0 图层增强（同构复刻 web/index.uts）
// ═══════════════════════════════════════════════════════════
const pocV180TileLayers = new Map();  // 复刻 customTileLayers: {sourceId, layerId, tileUrl, options}
let pocV180TileIds = [];              // 复刻 customTileLayerIds 平行数组
let pocStyleLoadHandler = null;       // 复刻 styleLoadHandler（防 once 监听累积）

function buildWmsTileUrlPoc(wmsUrl, layers) {
  const sep = wmsUrl.indexOf('?') >= 0 ? '&' : '?';
  return wmsUrl + sep + 'SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=' + layers +
    '&STYLES=&FORMAT=image/png&TRANSPARENT=true&SRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256';
}

function addCustomTilePoc(id, tileUrl, options) {
  const sourceId = 'custom-tile-src-' + id;
  const layerId = 'custom-tile-layer-' + id;
  map.addSource(sourceId, { type: 'raster', tiles: [tileUrl], tileSize: 256,
    minzoom: (options && options.minZoom) || 1, maxzoom: (options && options.maxZoom) || 18 });
  const layerObj = { id: layerId, type: 'raster', source: sourceId,
    minzoom: (options && options.minZoom) || 1, maxzoom: (options && options.maxZoom) || 18,
    paint: { 'raster-opacity': (options && options.opacity != null) ? options.opacity : 1 } };
  if (options && options.zIndex === 0) {
    if (map.getLayer('tdt-anno-layer') != null) map.addLayer(layerObj, 'tdt-anno-layer');
    else { map.addLayer(layerObj); log('zIndex=0 但无注记层，回退置顶（与插件一致）', 'warn'); }
  } else {
    map.addLayer(layerObj);
    if (options && options.zIndex != null && options.zIndex !== 0) log('zIndex 仅支持 0 与 undefined，已忽略（与插件一致）', 'warn');
  }
  pocV180TileLayers.set(id, { sourceId: sourceId, layerId: layerId, tileUrl: tileUrl, options: options || {} });
  pocV180TileIds.push(id);
}

function rebuildPoc() {
  const ids = pocV180TileIds.slice();
  pocV180TileIds = [];
  const saved = [];
  for (const id of ids) {
    const info = pocV180TileLayers.get(id);
    if (info != null) saved.push({ id: id, info: info });
  }
  pocV180TileLayers.clear();
  for (const s of saved) addCustomTilePoc(s.id, s.info.tileUrl, s.info.options);
}

function registerStyleLoadPoc(fn) {
  // 实测修正：MapLibre GL JS 4.7.1 setStyle 后不触发 'style.load'（不在 map 事件列表），
  // 样式替换完成触发 'styledata'（浏览器实测：仅 styledata）
  if (pocStyleLoadHandler != null) map.off('styledata', pocStyleLoadHandler);
  pocStyleLoadHandler = fn;
  map.once('styledata', pocStyleLoadHandler);
}

  try {
    if (!map) { log('请先加载地图', 'fail'); return; }

    addCustomTilePoc('wms-poc', url, { opacity: 0.8, zIndex: 0, minZoom: 3, maxZoom: 15 });

  try {
